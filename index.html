<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050812" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="마지막 등불을 들고 심연의 세 구역을 내려가는 액션 캠페인" />
    <title>Abyssal Lantern — Main Campaign</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="react-game-ui.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="page-atmosphere" aria-hidden="true"></div>
    <noscript>
      <section class="noscript" aria-labelledby="noscript-title">
        <p class="noscript-kicker">ABYSSAL LANTERN</p>
        <h1 id="noscript-title">심연의 등불을 밝히려면 JavaScript가 필요합니다.</h1>
        <p>이 게임은 전장 시뮬레이션과 로컬 저장을 브라우저에서 실행합니다. JavaScript를 켠 뒤 새로고침하세요.</p>
      </section>
    </noscript>
    <main id="defense-app" aria-live="polite"></main>
    <script type="module" src="app.js"></script>
    <script>
      if (new URLSearchParams(window.location.search).has("agentation")) {
        const agentationScript = document.createElement("script");
        agentationScript.type = "module";
        agentationScript.src = "agentation-toolbar.js";
        document.head.appendChild(agentationScript);
      }
    </script>
  </body>
</html>

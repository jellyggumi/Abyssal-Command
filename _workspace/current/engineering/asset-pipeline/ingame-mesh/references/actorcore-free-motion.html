        }

        function getSafariVersion() {
            const IS_SAFARI = /^((?!chrome|android).)*safari/i.test(
                navigator.userAgent

            if (!IS_SAFARI) {
                return false;
            }

            let version = navigator.userAgent.match(/version\/(\d+)/i);
            return version != null ? parseFloat(version[1]) : false;
        }

        function getFirefoxVersion() {
            let match = window.navigator.userAgent.match(/Firefox\/([0-9]+)\./);

        }
